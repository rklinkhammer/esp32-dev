name: Build environment
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [esp32s3, esp32c3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest discover -s tests -v
      - run: ./esp32 pull
      - run: ./esp32 --target ${{ matrix.target }} smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-${{ matrix.target }}
          path: |
            examples/smoke/build/*.bin
            examples/smoke/build/*.elf
            examples/smoke/build/flasher_args.json
            examples/smoke/build/bootloader/bootloader.bin
            examples/smoke/build/partition_table/partition-table.bin
